name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Assert FoF Upload pin
        run: |
          composer show fof/upload | tee /tmp/fof-upload.txt
          grep -E '^versions\s+:\s+\* 2\.0\.2$' /tmp/fof-upload.txt
          composer show flarum/core | tee /tmp/flarum-core.txt
          grep -E '^versions\s+:\s+\* v2\.0\.2$' /tmp/flarum-core.txt
          composer show league/flysystem | tee /tmp/flysystem.txt
          grep -E '^versions\s+:\s+\* 3\.' /tmp/flysystem.txt

      - name: Run tests
        run: composer test
